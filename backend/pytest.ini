[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
# Las deprecaciones de Pydantic v2 (config de clase) vienen de los esquemas de la
# aplicación y no aportan nada a la lectura de la suite. Se silencian solo aquí:
# no se toca ninguna configuración de producción.
filterwarnings =
    ignore::pydantic.warnings.PydanticDeprecatedSince20
