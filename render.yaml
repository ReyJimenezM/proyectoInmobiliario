# Render.com Blueprint Spec
# https://render.com/docs/blueprint-spec

databases:
  - name: fincaraiz-db
    plan: starter
    databaseName: fincaraiz
    user: fincaraiz
    ipAllowList: []

services:
  - type: web
    name: fincaraiz-backend
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /docs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fincaraiz-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_LOCAL_PATH
        value: /app/storage/documentos
      - key: STORAGE_PUBLIC_PATH
        value: /app/storage/propiedades
      - key: PUBLIC_BASE_URL
        fromService:
          name: fincaraiz-backend
          type: web
          property: hostport
      - key: TASA_REFERENCIAL_EA_DEFAULT
        value: "0.12"
    disk:
      name: storage
      mountPath: /app/storage
      sizeGB: 1

  - type: web
    name: fincaraiz-frontend
    runtime: docker
    plan: starter
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: fincaraiz-backend
          type: web
          property: hostport
      - key: API_INTERNAL_URL
        fromService:
          name: fincaraiz-backend
          type: web
          property: hostport
    buildArgs:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: fincaraiz-backend
          type: web
          property: hostport
